[package]
name = "lvp"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A media player built on libvlc, styled after the VLC Redesign (Community) Figma file"
license = "GPL-2.0-or-later"
default-run = "lvp"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.33"
egui-wgpu = "0.33"
env_logger = "0.11"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
libc = "0.2"
libloading = "0.9"
log = "0.4"
open = "5"
parking_lot = "0.12"
percent-encoding = "2"
quick-xml = "0.38"
resvg = "0.48"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
url = "2"
walkdir = "2"

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["wgpu", "snapshot", "eframe"] }
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString", "NSOperation", "NSURL", "NSObject"] }
