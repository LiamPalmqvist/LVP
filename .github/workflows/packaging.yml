name: Packages

# Keeps the Homebrew cask, the AUR packages (notvlc and notvlc-bin) and the
# winget manifest in step with NotVLC's releases. build.yml runs this after it
# publishes a release; run it by hand (Actions > Packages > Run workflow, or
# `gh workflow run packaging.yml -f tag=v0.2.0`) to publish a release again.
#
# Every run first proves the packages work: the cask installs on macOS, both
# AUR packages build and install on Arch, and winget validates and installs the
# manifest on Windows. A pull request that touches packaging stops there.
# Publishing then pushes the cask to LiamPalmqvist/homebrew-notvlc, the
# PKGBUILDs to the AUR and a pull request to microsoft/winget-pkgs, and
# records the new version in packaging/ on main. A channel whose secret is not
# set is skipped with a notice; packaging/README.md describes the secrets.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: true
    secrets:
      HOMEBREW_TAP_KEY:
        required: false
      AUR_SSH_KEY:
        required: false
      WINGET_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0
        type: string
        required: true
      publish:
        description: Push to Homebrew, the AUR and winget (off checks only)
        type: boolean
        default: true
  pull_request:
    paths:
      - packaging/**
      - .github/workflows/packaging.yml
      - tools/build-linux.sh

permissions:
  contents: read

concurrency:
  group: packaging-${{ inputs.tag || github.ref }}

env:
  # On a pull request there is no tag: packaging/ is checked as it stands.
  TAG: ${{ inputs.tag }}
  PUBLISH: ${{ github.event_name != 'pull_request' && inputs.publish }}

jobs:
  # Bumps packaging/ once, on Linux, and hands the same files to every channel.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point packaging/ at the release
        if: env.TAG != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: packaging/bump.sh "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: packaging
          path: packaging/
          if-no-files-found: error
          # Keeps each .SRCINFO.
          include-hidden-files: true

  homebrew:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging
      - name: Install from a local tap
        env:
          # brew audit --online reads the GitHub API; anonymously, a runner shares
          # its rate limit with every other job on the same address.
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew update --quiet
          brew tap-new --no-git notvlc/ci
          tap="$(brew --repository)/Library/Taps/notvlc/homebrew-ci"
          mkdir -p "$tap/Casks"
          cp packaging/homebrew/notvlc.rb "$tap/Casks/"
          brew style --cask notvlc/ci/notvlc
          brew audit --cask --online --strict notvlc/ci/notvlc
          brew install --cask notvlc/ci/notvlc
          app=/Applications/NotVLC.app
          if xattr -p com.apple.quarantine "$app" >/dev/null 2>&1; then
            echo "::error::NotVLC.app is still quarantined after install"
            exit 1
          fi
          "$app/Contents/MacOS/notvlc" --export-icon "$RUNNER_TEMP/icon.png"
          test -s "$RUNNER_TEMP/icon.png"
          brew uninstall --cask --zap notvlc/ci/notvlc
      - name: Push to the tap
        if: env.PUBLISH == 'true'
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          if [ -z "$TAP_KEY" ]; then
            echo "::notice::HOMEBREW_TAP_KEY is not set, so the tap was not updated."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/github_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/github_hosts"
          git clone git@github.com:LiamPalmqvist/homebrew-notvlc.git "$RUNNER_TEMP/tap"
          cp packaging/homebrew/notvlc.rb "$RUNNER_TEMP/tap/Casks/notvlc.rb"
          cd "$RUNNER_TEMP/tap"
          git add Casks/notvlc.rb
          if git diff --cached --quiet; then
            echo "The tap already has this version."
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/notvlc.rb)
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "notvlc $version"
          git push origin HEAD

  aur:
    needs: prepare
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        pkg: [notvlc, notvlc-bin]
    steps:
      - run: pacman -Syu --noconfirm --needed git jq namcap openssh
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging
      - name: Build and install
        working-directory: packaging/aur/${{ matrix.pkg }}
        run: |
          # makepkg refuses to run as root.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder .
          sudo -u builder makepkg --printsrcinfo > .SRCINFO.made
          if ! diff -u .SRCINFO .SRCINFO.made; then
            if [ "$PUBLISH" = true ]; then
              echo "::warning::packaging/aur/${{ matrix.pkg }}/.SRCINFO differs from makepkg's; the AUR gets makepkg's."
            else
              echo "::error::packaging/aur/${{ matrix.pkg }}/.SRCINFO does not match the PKGBUILD"
              exit 1
            fi
          fi
          sudo -u builder makepkg --syncdeps --noconfirm
          namcap PKGBUILD ./*.pkg.tar.zst || true
          pacman -U --noconfirm ./*.pkg.tar.zst
          notvlc --export-icon /tmp/icon.png
          test -s /tmp/icon.png
      - name: Push to the AUR
        if: env.PUBLISH == 'true'
        working-directory: packaging/aur/${{ matrix.pkg }}
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          # Off until the repository variable AUR_PUBLISH is set to true.
          AUR_PUBLISH: ${{ vars.AUR_PUBLISH }}
        run: |
          if [ "$AUR_PUBLISH" != true ]; then
            echo "::notice::AUR publishing is off (repository variable AUR_PUBLISH), so ${{ matrix.pkg }} was built but not pushed."
            exit 0
          fi
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::AUR_SSH_KEY is not set, so ${{ matrix.pkg }} was built but not pushed."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # The AUR's published ed25519 key: SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/aur_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/aur_hosts -o BatchMode=yes"
          # A key that is on no AUR account (registration can be closed) skips
          # the push rather than failing the release.
          if ! $GIT_SSH_COMMAND aur@aur.archlinux.org help >/dev/null 2>&1; then
            echo "::warning::The AUR does not accept AUR_SSH_KEY; add its public key to an AUR account. ${{ matrix.pkg }} was built but not pushed."
            exit 0
          fi
          # A name the AUR does not have yet clones empty and is created by the push.
          git clone "ssh://aur@aur.archlinux.org/${{ matrix.pkg }}.git" /tmp/aur
          cp PKGBUILD /tmp/aur/PKGBUILD
          cp .SRCINFO.made /tmp/aur/.SRCINFO
          cd /tmp/aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already has this version."
            exit 0
          fi
          release="$(sed -n 's/^\tpkgver = //p' .SRCINFO)-$(sed -n 's/^\tpkgrel = //p' .SRCINFO)"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update to $release"
          git push origin HEAD:master

  winget:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging
      # GitHub's Windows images do not ship a working winget, and the WinGet
      # module's Repair-WinGetPackageManager trips over the image's own copy of
      # App Installer. This installs winget's latest release with its x64
      # dependencies instead.
      - name: Install winget
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          $dir = Join-Path $env:RUNNER_TEMP "winget"
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download -R microsoft/winget-cli -D $dir `
            -p "Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle" -p "DesktopAppInstaller_Dependencies.zip"
          Expand-Archive (Join-Path $dir "DesktopAppInstaller_Dependencies.zip") (Join-Path $dir "deps")
          $deps = Get-ChildItem (Join-Path $dir "deps\x64") -Filter *.appx | ForEach-Object FullName
          Add-AppxPackage -Path (Join-Path $dir "Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle") `
            -DependencyPath $deps -ForceUpdateFromAnyVersion -ForceApplicationShutdown
          $apps = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps"
          $apps | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & (Join-Path $apps "winget.exe") --version
      - name: Validate and install the manifest
        shell: pwsh
        run: |
          winget validate --manifest packaging/winget
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # winget's own scan of a local manifest's archive reports malware when
          # Defender's real-time protection is off, as it is on these runners, so
          # scan the release zip with Defender directly and name anything it finds.
          $url = (Select-String -Path packaging/winget/*.installer.yaml -Pattern '^\s*InstallerUrl:\s*(\S+)').Matches[0].Groups[1].Value
          $zip = Join-Path $env:RUNNER_TEMP "notvlc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Get-MpComputerStatus | Format-List AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated
          try { Update-MpSignature -ErrorAction Stop } catch { Write-Warning "Defender signatures not updated: $_" }
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $zip -DisableRemediation
          $scan = $LASTEXITCODE
          Get-MpThreatDetection | Format-List ThreatID, Resources, ActionSuccess
          Get-MpThreat | Format-List ThreatName, SeverityID
          # MpCmdRun exits 2 when it finds a threat; anything else non-zero means it could not scan.
          if ($scan -eq 2) { throw "Windows Defender flags $url" }
          if ($scan -ne 0) { Write-Warning "Windows Defender could not scan $url (MpCmdRun exit $scan)" }
          winget settings --enable LocalManifestFiles
          winget settings --enable LocalArchiveMalwareScanOverride
          winget install --manifest packaging/winget --accept-package-agreements --accept-source-agreements --disable-interactivity --ignore-local-archive-malware-scan
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter NotVLC.exe | Select-Object -First 1
          if (-not $exe) { throw "winget did not install NotVLC.exe" }
          $icon = Join-Path $env:RUNNER_TEMP "icon.png"
          Start-Process -FilePath $exe.FullName -ArgumentList @("--export-icon", $icon) -Wait -NoNewWindow
          if (-not (Test-Path $icon)) { throw "NotVLC.exe did not run" }

  winget-submit:
    needs: [prepare, winget]
    if: github.event_name != 'pull_request' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: packaging
      - name: Open the winget-pkgs pull request
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VALIDATED: "1"
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::WINGET_TOKEN is not set, so no winget-pkgs pull request was opened."
            exit 0
          fi
          # An artifact keeps no execute bit.
          sh packaging/winget-submit.sh "$TAG"

  record:
    needs: [homebrew, aur, winget-submit]
    if: github.event_name != 'pull_request' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Record the release in packaging/
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          packaging/bump.sh "$TAG"
          git add packaging
          if git diff --cached --quiet; then
            echo "packaging/ already names $TAG."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Packaging: Homebrew, AUR and winget point at $TAG"
          git push origin HEAD
