name: Build

# Packages NotVLC for macOS, Linux and Windows with the scripts in tools/.
# Runs by hand (Actions > Build > Run workflow, or `gh workflow run build.yml`)
# and on version tags; a tag also publishes the packages as a GitHub release,
# then updates the Homebrew cask, the AUR packages and the winget manifest.
# Not on every push: macOS runners cost ten times the minutes on a private repo.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      # The bundle script draws the app icon with rsvg-convert and ImageMagick.
      - run: brew install librsvg imagemagick
      - run: tools/bundle-macos.sh
      - name: Zip the app
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ditto -c -k --keepParent dist/NotVLC.app "dist/notvlc-$version-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  linux:
    # The oldest supported Ubuntu, so the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - run: tools/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@v2
      - run: powershell -ExecutionPolicy Bypass -File tools\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Homebrew, the AUR and winget follow the release; see packaging/README.md.
  packages:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/packaging.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
